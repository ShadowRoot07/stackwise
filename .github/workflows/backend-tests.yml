name: Backend Tests

on:
  push:
    branches: [ main, feature/ai-description-generator ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Aunque usas SQLite para tests, tener Redis listo 
      # ayuda si luego quieres probar Celery de verdad
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        # Instalamos pytest-cov por si quieres ver qué tanto código cubres
        pip install pytest-cov 

    - name: Run Tests
      env:
        # Variables de entorno necesarias para que FastAPI no explote
        DATABASE_URL: sqlite:///./test.db
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} 
      run: |
        cd backend
        python -m pytest -v

